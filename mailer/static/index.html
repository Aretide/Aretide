<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beema Health mailer</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: #e6e6e6;
      --paper: #fffdf8;
      --card: #ffffff;
      --honey: #e5b01a;
      --honey-ink: #1a1a1a;
      --ok: #1f7a4d;
      --wait: #8a5a12;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.5 "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    main {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      min-height: calc(100vh - 72px);
    }
    section { padding: 1.25rem 1.5rem; }
    .board { border-right: 1px solid var(--line); overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.65rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    tr { cursor: pointer; }
    tr:hover { background: #fff8e6; }
    tr.active { background: #fff1c4; }
    .chip {
      display: inline-block;
      margin: 0 0.2rem 0.2rem 0;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      background: #f3f1ea;
      font-size: 0.75rem;
    }
    .chip.due { background: #e8f6ee; color: var(--ok); }
    .chip.wait { background: #fff3d6; color: var(--wait); }
    button, select, input, textarea {
      font: inherit;
    }
    button {
      min-height: 44px;
      padding: 0.5rem 0.9rem;
      border: 0;
      border-radius: 8px;
      background: var(--honey);
      color: var(--honey-ink);
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #eeeae2; }
    button.danger { background: #1a1a1a; color: #fff; }
    label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.9rem; }
    input, select, textarea {
      width: 100%;
      min-height: 44px;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
    .checks label { display: flex; align-items: center; gap: 0.5rem; min-height: 44px; }
    .checks input { width: auto; min-height: 20px; }
    h2 { font-size: 1rem; margin: 0 0 0.75rem; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .status { font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Beema Health mailer</h1>
      <p id="unlock">Loading…</p>
    </div>
    <div class="row">
      <button class="secondary" id="refresh">Refresh</button>
      <button id="open-add">Add patient</button>
    </div>
  </header>
  <main>
    <section class="board">
      <h2>Patients</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Campaigns</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
    <section>
      <div class="panel" id="detail">
        <h2>Select a patient</h2>
        <p class="muted">Assign campaigns, see last step / last sent, and send one person or a whole campaign.</p>
      </div>
      <div class="panel">
        <h2>Send a campaign</h2>
        <label for="campaign">Campaign</label>
        <select id="campaign"></select>
        <div class="row">
          <button class="secondary" id="plan-all">Show due list</button>
          <button id="send-all">Send due emails</button>
        </div>
        <p class="muted" id="plan-note"></p>
      </div>
      <div class="panel" id="add-panel" hidden>
        <h2>Add patient</h2>
        <label for="first">First name</label>
        <input id="first">
        <label for="email">Email</label>
        <input id="email" type="email">
        <label for="status">Status</label>
        <select id="status">
          <option value="abandoned">Abandoned</option>
          <option value="lead">Lead</option>
          <option value="active">Active</option>
        </select>
        <label for="abandoned">Abandoned at (optional, Denver)</label>
        <input id="abandoned" placeholder="2026-08-26 9:37">
        <div class="checks" id="add-campaigns"></div>
        <div class="row">
          <button id="save-patient">Save encrypted</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    let state = { unlocked: false, patients: [], campaigns: [] };
    let selected = null;

    async function load() {
      const res = await fetch("/api/state");
      state = await res.json();
      document.getElementById("unlock").textContent = state.unlocked
        ? "PII unlocked. Names and emails are visible."
        : "PII locked. Names and emails show as ***.";
      const campaignSelect = document.getElementById("campaign");
      campaignSelect.innerHTML = state.campaigns.map(c => `<option value="${c.id}">${c.label}</option>`).join("");
      document.getElementById("add-campaigns").innerHTML = state.campaigns.map(c =>
        `<label><input type="checkbox" value="${c.id}" ${c.id === "abandoned" ? "checked" : ""}> ${c.label}</label>`
      ).join("");
      renderRows();
      if (selected) renderDetail(state.patients.find(p => p.id === selected) || null);
    }

    function renderRows() {
      document.getElementById("rows").innerHTML = state.patients.map(p => {
        const chips = (p.campaigns || []).filter(c => c.enrolled).map(c => {
          const cls = c.due_now ? "due" : "wait";
          return `<span class="chip ${cls}">${c.label}: ${c.plan}</span>`;
        }).join("") || "<span class='muted'>none</span>";
        return `<tr data-id="${p.id}" class="${p.id === selected ? "active" : ""}">
          <td>${p.first_name}</td><td>${p.email}</td><td>${p.status}</td><td>${chips}</td>
        </tr>`;
      }).join("");
      document.querySelectorAll("tr[data-id]").forEach(row => {
        row.addEventListener("click", () => {
          selected = row.dataset.id;
          renderRows();
          renderDetail(state.patients.find(p => p.id === selected));
        });
      });
    }

    function renderDetail(p) {
      const el = document.getElementById("detail");
      if (!p) {
        el.innerHTML = "<h2>Select a patient</h2><p class='muted'>Assign campaigns and send.</p>";
        return;
      }
      const boxes = (p.campaigns || []).map(c => `
        <label><input type="checkbox" data-campaign="${c.id}" ${c.enrolled ? "checked" : ""}> ${c.label}
          <span class="muted"> · last ${c.last_step || "—"} · ${c.plan}</span>
        </label>`).join("");
      el.innerHTML = `
        <h2>${p.first_name}</h2>
        <p class="status">${p.email} · ${p.status}</p>
        <p class="muted">Abandoned: ${p.abandoned_at || "—"}</p>
        <div class="checks">${boxes}</div>
        <div class="row">
          <button class="secondary" id="save-campaigns">Save campaigns</button>
          <button id="send-one">Send this patient's due email</button>
        </div>`;
      document.getElementById("save-campaigns").onclick = saveCampaigns;
      document.getElementById("send-one").onclick = () => send({ patient_ids: [p.id] });
    }

    async function saveCampaigns() {
      const boxes = [...document.querySelectorAll("#detail [data-campaign]")];
      const campaigns = {};
      boxes.forEach(box => campaigns[box.dataset.campaign] = box.checked);
      await fetch("/api/patients/" + selected + "/campaigns", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ campaigns })
      });
      await load();
    }

    async function send(extra) {
      const campaign_id = document.getElementById("campaign").value;
      const body = Object.assign({ campaign_id, dry_run: false, force_to: "" }, extra || {});
      if (!confirm("Send now?")) return;
      const res = await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      document.getElementById("plan-note").textContent = data.message || JSON.stringify(data.preview || data);
      await load();
    }

    document.getElementById("refresh").onclick = load;
    document.getElementById("open-add").onclick = () => {
      document.getElementById("add-panel").hidden = false;
    };
    document.getElementById("save-patient").onclick = async () => {
      const campaign_ids = [...document.querySelectorAll("#add-campaigns input:checked")].map(i => i.value);
      await fetch("/api/patients", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          first_name: document.getElementById("first").value,
          email: document.getElementById("email").value,
          status: document.getElementById("status").value,
          abandoned_at: document.getElementById("abandoned").value,
          campaign_ids
        })
      });
      document.getElementById("add-panel").hidden = true;
      await load();
    };
    document.getElementById("plan-all").onclick = async () => {
      const campaign_id = document.getElementById("campaign").value;
      const res = await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ campaign_id, dry_run: true })
      });
      const data = await res.json();
      document.getElementById("plan-note").textContent = (data.preview || []).map(p =>
        `${p.name} · ${p.email} · ${p.step}`
      ).join(" | ") || "Nobody is due.";
    };
    document.getElementById("send-all").onclick = () => send({});
    load();
  </script>
</body>
</html>
